<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MacroCoach</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <nav class="tabbar">
    <div class="brand">MacroCoach</div>
    <div class="tabs">
      <button class="tab active" data-tab="chat">Chat</button>
      <button class="tab" data-tab="daily">Daily</button>
      <button class="tab" data-tab="weekly">Weekly</button>
      <button class="tab" data-tab="training">Training</button>
      <button class="tab" data-tab="habits">Habits</button>
    </div>
  </nav>

  <!-- ===================== CHAT (home) ===================== -->
  <section class="panel chatpanel" id="panel-chat">
    <div class="chat-hero" id="chatHero">
      <h1>What did you eat?</h1>
      <p class="sub">Describe a meal in plain language — I'll estimate the macros, honestly, with a confidence range.</p>
    </div>
    <div class="chat-thread" id="chatThread"></div>
    <form class="chat-composer" id="chatComposer">
      <div class="input-wrap">
        <div class="ghost" id="chatGhost" aria-hidden="true"></div>
        <input id="chatInput" autocomplete="off"
               placeholder="3 eggs, a serving of Flourish, 50g blueberries…" />
      </div>
      <button id="chatSend" type="submit">Send</button>
    </form>
  </section>

  <!-- ===================== DAILY ===================== -->
  <section class="panel" id="panel-daily" hidden>
    <div class="daynav">
      <button class="ghost" id="dPrev" aria-label="Previous day">‹</button>
      <h2 id="dTitle">Today</h2>
      <button class="ghost" id="dNext" aria-label="Next day">›</button>
      <span class="grow"></span>
      <button class="secondary" id="dTrain">+ Training</button>
      <button class="secondary" id="dSleep">+ Sleep</button>
      <button class="secondary" id="dWeigh">+ Weigh-in</button>
      <button class="secondary" id="dTarget">Target</button>
    </div>
    <div class="summary" id="dSummary"></div>
    <div class="rings" id="dRings"></div>
    <p class="dayline" id="dDayline"></p>
    <div class="log" id="dLog"></div>
  </section>

  <!-- ===================== WEEKLY (eating) ===================== -->
  <section class="panel" id="panel-weekly" hidden>
    <div class="weekhead">
      <button class="ghost" id="wPrev" aria-label="Previous week">‹</button>
      <h2 id="wLabel">Week</h2>
      <button class="ghost" id="wNext" aria-label="Next week">›</button>
    </div>
    <div class="calendar" id="wCalendar"></div>
    <div class="trendcard">
      <svg id="sparkline" viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true"></svg>
      <p class="context" id="wContext"></p>
      <p class="deficit" id="wDeficit"></p>
    </div>
  </section>

  <!-- ===================== TRAINING (Coach | Week | Macrocycle) ===================== -->
  <section class="panel" id="panel-training" hidden>
    <div class="subnav">
      <button class="subtab active" data-sub="coach">Coach</button>
      <button class="subtab" data-sub="week">Week</button>
      <button class="subtab" data-sub="macro">Macrocycle</button>
    </div>

    <!-- Coach -->
    <div class="subpanel coachpanel" id="sub-coach">
      <div class="chat-thread" id="coachThread"></div>
      <div class="chips" id="coachChips"></div>
      <form class="chat-composer inline" id="coachComposer">
        <div class="input-wrap">
          <div class="ghost" id="coachGhost" aria-hidden="true"></div>
          <input id="coachInput" autocomplete="off"
                 placeholder="Create a 10-week running program starting at 30km, +10% a week, week-4 deload…" />
        </div>
        <button type="submit">Send</button>
      </form>
    </div>

    <!-- Week -->
    <div class="subpanel" id="sub-week" hidden>
      <div class="weekhead">
        <button class="ghost" id="tPrev" aria-label="Previous week">‹</button>
        <h2 id="tLabel">Training week</h2>
        <button class="ghost" id="tNext" aria-label="Next week">›</button>
      </div>
      <div class="train-week" id="tWeek"></div>
    </div>

    <!-- Macrocycle -->
    <div class="subpanel" id="sub-macro" hidden>
      <div class="macro-head">
        <select id="programSelect" class="select"></select>
        <button class="secondary" id="newRun">+ Running block</button>
        <button class="secondary" id="newClimb">+ Climbing block</button>
        <span class="grow"></span>
        <button class="secondary" id="delProgram">Delete</button>
      </div>
      <div id="macroGrid" class="macrogrid-wrap"></div>
    </div>
  </section>

  <!-- ===================== HABITS (journal) ===================== -->
  <section class="panel" id="panel-habits" hidden>
    <div class="habits-head">
      <h3>Habit tracker</h3>
      <div class="chart-legend">
        <span class="lg sleep">● Sleep (h)</span>
        <span class="lg rec">● Recovery /100</span>
      </div>
      <button class="secondary" id="addHabit">+ Add habit</button>
    </div>
    <div class="journal">
      <div class="habitgrid-wrap">
        <table class="habitgrid" id="habitGrid"></table>
      </div>
      <div class="chartcol">
        <div class="chartcol-head" id="chartHead"></div>
        <svg id="journalChart" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </section>

  <template id="ringTpl">
    <div class="ring">
      <div class="ring-remaining"><span class="num"></span><span class="unit"></span></div>
      <div class="ring-label"></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="ring-sub"></div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
